; microm8: a standalone handheld frontend for the Dirtywave M8 Headless on the M5Stack Tab5
; (ESP32-P4: 5" 720x1280 portrait, high-speed USB-A host, ES8388 audio, battery).
;
; Uses the pioarduino platform (Arduino core 3.x on ESP-IDF 5.x). The stock PlatformIO
; espressif32 platform ships Arduino 2.x / IDF 4.4, whose USB host stack lacks the
; isochronous support needed for M8 audio.

[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; Targets ESP32-P4 chip revisions before 3.0 (the board definition's "ES" variant). esptool
; prints the chip revision when flashing; if yours reports v3.x, this needs a rev-3 target.
board = m5stack-tab5-p4
; The Tab5 has 16 MB of flash. Without this, the build falls back to Arduino's 4 MB layout
; (1.25 MB app slots). partitions.csv is Arduino's default_16MB.csv: two 6.25 MB app slots,
; 3.4 MB SPIFFS, crash dump. It lives in the project because the custom_sdkconfig core
; rebuild only looks there.
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Rebuilds the Arduino core with two changes (the first build after editing this takes
; several minutes):
; - The prebuilt core caps USB control transfers at 256 bytes, and ESP-IDF abandons
;   enumeration of any device whose configuration descriptor is larger. The M8's composite
;   (serial + audio + MIDI) descriptor is 376 bytes.
; - The prebuilt core compiles out ESP-IDF logging below ERROR level. INFO lets USB stack
;   messages (and ours, see USE_ESP_IDF_LOG below) reach the console and the on-screen log.
custom_sdkconfig =
    CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=1024
    '# CONFIG_LOG_DEFAULT_LEVEL_ERROR is not set'
    CONFIG_LOG_DEFAULT_LEVEL_INFO=y
    CONFIG_LOG_DEFAULT_LEVEL=3
    CONFIG_LOG_MAXIMUM_LEVEL=3

; M5Stack's libraries handle the Tab5's display (all panel/touch revisions), touch, power
; rails and I/O expanders.
lib_deps =
    https://github.com/m5stack/M5GFX.git
    https://github.com/m5stack/M5Unified.git

; The M8 uses the P4's high-speed USB controller on USB-A. USB-C is the USB-Serial-JTAG port
; (flashing and logs; the board definition sets ARDUINO_USB_CDC_ON_BOOT=1) while no M8 is
; connected, and the M8 passed through to a computer while one is (see src/usb/passthru.h).
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Route ESP_LOGx through ESP-IDF's logger instead of Arduino's, so the on-screen log
    ; (shown while waiting for the M8) captures our messages too.
    -DUSE_ESP_IDF_LOG
    ; Uncomment to turn the portrait layout upside down.
    ; -DTAB5_ROTATE_180=1
    ; Uncomment to turn off automatic speaker/headphone switching on plug/unplug.
    ; -DTAB5_HP_DET_INSERTED_LEVEL=-1

; Host-side unit tests for the M8 protocol parser and framebuffer renderer:
;   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<m8/>
build_flags =
    -Isrc
    -Itest/stubs
