; microm8 — M8 Headless frontend for the Guition JC4827W543 (ESP32-S3, 4.3" 480x272 NV3041A QSPI, GT911 touch)
;
; Uses the pioarduino platform (Arduino core 3.x on ESP-IDF 5.x). The stock PlatformIO
; espressif32 platform ships Arduino 2.x / IDF 4.4, whose USB host stack lacks the
; isochronous support needed for M8 audio.

[platformio]
default_envs = jc4827w543

[env:jc4827w543]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; ESP32-S3-WROOM-1-N4R8: 4 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv ; Arduino's huge_app layout: 3 MB app
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728

; Rebuilds the Arduino core with two changes (the first build after editing this takes
; several minutes):
; - The prebuilt core caps USB control transfers at 256 bytes, and ESP-IDF abandons
;   enumeration of any device whose configuration descriptor is larger. The M8's composite
;   (serial + audio) descriptor is larger.
; - The prebuilt core compiles out ESP-IDF logging below ERROR level. INFO lets USB stack
;   messages (and ours, see USE_ESP_IDF_LOG below) reach UART and the on-screen log.
custom_sdkconfig =
    CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=1024
    '# CONFIG_LOG_DEFAULT_LEVEL_ERROR is not set'
    CONFIG_LOG_DEFAULT_LEVEL_INFO=y
    CONFIG_LOG_DEFAULT_LEVEL=3
    CONFIG_LOG_MAXIMUM_LEVEL=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0

build_flags =
    -DBOARD_HAS_PSRAM
    ; The native USB port (GPIO19/20) is used as a USB *host* for the M8, so the Arduino
    ; USB device stack must stay off. Serial logging goes to UART0 (GPIO43/44, the P1 header).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    ; Route ESP_LOGx through ESP-IDF's logger instead of Arduino's, so the on-screen log
    ; (shown while waiting for the M8) captures our messages too.
    -DUSE_ESP_IDF_LOG
    ; Uncomment to put the key panel on the left side of the screen instead of the right.
    -DMICROM8_PANEL_LEFT=1
    ; Uncomment to add stereo headphone output through an external I2S DAC (e.g. PCM5102A)
    ; wired to headers P4/P5 + P3. Wiring is in src/config.h. Adds an SPK/HP toggle to the
    ; status bar. If the jack has a detect switch, also set HP_DETECT_PIN (see config.h).
    ; -DMICROM8_HEADPHONES=1
    ; -DHP_DETECT_PIN=7

; Host-side unit tests for the M8 protocol parser and framebuffer renderer:
;   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<m8/>
build_flags =
    -Isrc
    -Itest/stubs
